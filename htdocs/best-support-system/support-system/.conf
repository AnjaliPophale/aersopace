# nginx configuration
location ~ 404 {
    rewrite ^(.*)$ /\\.(svn|git|hg|bzr|cvs)(/|$) redirect;
}
location /best-support-system/support-system/ {
    if (!-e $request_filename){
        rewrite ^/best-support-system/support-system/(.*)$ /best-support-system/support-system/index.php?/$1 break;
    }
}